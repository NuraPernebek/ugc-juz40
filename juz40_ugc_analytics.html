#ugc40 .g-list{display:flex;flex-direction:column;gap:9px}
#ugc40 .g-row{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--g-line);border-radius:16px;padding:12px 15px;cursor:pointer;

}

  title:'Результаты конкурса <span class="gr">в реальных цифрах</span>',
  sub:'Просмотры, лайки и лучшие участники по видео с хэштегами конкурса. Данные собираются и обновляются вручную.',
  stViews:'всего просмотров', stVideos:'видео', stUsers:'участников', stLikes:'лайков',
  mViews:'Просмотры', mLikes:'Лайки', mComments:'Комменты',
  posts:'видео', vidH:'Топ видео', hashH:'По хэштегам',
  hVid:'видео', hViews:'просмотров',
  loading:'Загружаем данные…',
  errH:'Данные не загрузились', errP:'Проверьте, что DATA_URL указан верно, или обновите страницу.',
  emptyH:'Пока нет данных', emptyP:'Похоже, файл data.json ещё не загружен на GitHub.',
  more:'Показать ещё', less:'Свернуть',
  note:'Последнее обновление: {d}. Статистика собирается по хэштегам конкурса в TikTok.'
 }
};

var app=document.getElementById('ugc40');
var $=function(id){return document.getElementById(id)};
var lang='kz', metric='views', DATA=null, expU=false, expV=false;

function t(k){return I18N[lang][k]||''}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function short(n){
  if(n>=1e6) return (n/1e6).toFixed(n<1e7?1:0).replace('.0','')+'M';
  if(n>=1e3) return (n/1e3).toFixed(n<1e4?1:0).replace('.0','')+'K';
  return String(n);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

function applyI18n(){
  app.querySelectorAll('[data-i]').forEach(function(el){el.innerHTML=t(el.getAttribute('data-i'))});
  var mb=$('umetric').querySelectorAll('button');
  mb[0].textContent=t('mViews');mb[1].textContent=t('mLikes');mb[2].textContent=t('mComments');
  $('umore').textContent=expU?t('less'):t('more');
  $('uvmore').textContent=expV?t('less'):t('more');
  if(DATA) renderNote();
}

function setState(kind){
  var s=$('ustate');
  if(!kind){s.style.display='none';return}
  s.style.display='block';
  $('upanel').style.display='none';
  if(kind==='loading'){s.innerHTML='<div class="g-spin"></div><p>'+t('loading')+'</p>';return}
  s.innerHTML='<h3>'+t(kind+'H')+'</h3><p>'+t(kind+'P')+'</p>';
}

function countUp(el,to,ms){
  var t0=null;
  function step(ts){
    if(!t0)t0=ts;
    var p=Math.min((ts-t0)/ms,1);
    el.textContent=short(Math.round(to*(1-Math.pow(1-p,3))));
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ── подиум ── */
function renderPodium(users){
  var pd=$('upodium');pd.innerHTML='';
  users.slice(0,3).forEach(function(u,i){
    var el=document.createElement('a');
    el.className='g-pcard'+(i===0?' p1':'');
    el.style.animationDelay=(i*0.06)+'s';
    el.href='https://www.tiktok.com/@'+encodeURIComponent(u.user);
    el.target='_blank';el.rel='noopener';
    el.innerHTML='<div class="medal">'+(i+1)+'</div>'+
      '<div class="pinfo"><div class="uid">@'+esc(u.user)+'</div>'+
      '<div class="nick">'+esc(u.nickname||'')+'</div></div>'+
      '<div class="pval"><div class="val">'+fmt(u[metric]||0)+'</div>'+
      '<div class="lbl">'+t('m'+metric[0].toUpperCase()+metric.slice(1))+'</div>'+
      '<div class="sub2">'+u.posts+' '+t('posts')+'</div></div>';
    pd.appendChild(el);
  });
}

/* ── лидерборд 4+ ── */
function renderBoard(users){
  var wrap=$('uboard');wrap.innerHTML='';
  var rest=users.slice(3, expU?users.length:SHOW_USERS);
  var max=users.length?users[0][metric]||1:1;
  rest.forEach(function(u,i){
    var el=document.createElement('a');
    el.className='g-row';
    el.style.animationDelay=(i*0.03)+'s';
    el.href='https://www.tiktok.com/@'+encodeURIComponent(u.user);
    el.target='_blank';el.rel='noopener';
    el.innerHTML='<span class="rk">'+(i+4)+'</span>'+
      '<span class="who"><b>@'+esc(u.user)+'</b><span>'+u.posts+' '+t('posts')+'</span></span>'+
      '<span class="bar"><i data-w="'+Math.max(3,Math.round((u[metric]||0)/max*100))+'"></i></span>'+
      '<span class="cnt">'+fmt(u[metric]||0)+'</span>';
    wrap.appendChild(el);
  });
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    wrap.querySelectorAll('.bar i').forEach(function(b){b.style.width=b.getAttribute('data-w')+'%'});
  })});
  $('umore').style.display=users.length>SHOW_USERS?'block':'none';
  $('umore').textContent=expU?t('less'):t('more');
}

/* ── видео ── */
function renderVideos(){
  var vids=(DATA.topVideos||[]).slice();
  if(!vids.length){$('uvidwrap').style.display='none';return}
  $('uvidwrap').style.display='block';
  var wrap=$('uvideos');wrap.innerHTML='';
  var max=vids[0].views||1;
  vids.slice(0, expV?vids.length:SHOW_VIDEOS).forEach(function(v,i){
    var el=document.createElement('a');
    el.className='g-row';
    el.style.animationDelay=(i*0.03)+'s';
    el.href=v.link;el.target='_blank';el.rel='noopener';
    el.innerHTML='<span class="rk">'+(i+1)+'</span>'+
      '<span class="who"><b>@'+esc(v.user)+'</b><span>'+esc(v.desc||'')+'</span></span>'+
      '<span class="bar"><i data-w="'+Math.max(3,Math.round(v.views/max*100))+'"></i></span>'+
      '<span class="cnt">'+short(v.views)+'</span>'+
      '<svg class="ext" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#275b6e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>';
    wrap.appendChild(el);
  });
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    wrap.querySelectorAll('.bar i').forEach(function(b){b.style.width=b.getAttribute('data-w')+'%'});
  })});
  $('uvmore').style.display=vids.length>SHOW_VIDEOS?'block':'none';
  $('uvmore').textContent=expV?t('less'):t('more');
}

/* ── хэштеги ── */
function renderHash(){
  var hs=DATA.byHashtag||[];
  if(!hs.length){$('uhashwrap').style.display='none';return}
  $('uhashwrap').style.display='block';
  var wrap=$('uhash');wrap.innerHTML='';
  hs.forEach(function(h){
    var el=document.createElement('div');
    el.className='g-hrow';
    el.innerHTML='<span class="tag">#'+esc(h.tag)+'</span>'+
      '<span class="m"><b>'+fmt(h.videos)+'</b><i>'+t('hVid')+'</i></span>'+
      '<span class="m"><b>'+short(h.views)+'</b><i>'+t('hViews')+'</i></span>';
    wrap.appendChild(el);
  });
}

function renderNote(){
  var d=new Date(DATA.updatedAt);
  var s=isNaN(d)?'—':('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear()+', '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
  $('unote').textContent=t('note').replace('{d}',s);
}

function renderAll(animateStats){
  var users=(DATA.topUsers||[]).slice().sort(function(a,b){return (b[metric]||0)-(a[metric]||0)});
  if(!users.length){setState('empty');return}
  setState(null);
  $('upanel').style.display='block';
  var tt=DATA.totals||{};
  app.querySelectorAll('.g-num').forEach(function(el,i){
    var v=tt[el.getAttribute('data-n')]||0;
    if(animateStats)countUp(el,v,1200+i*250);else el.textContent=short(v);
  });
  var tagwrap=$('utags');tagwrap.innerHTML='';
  (DATA.hashtags||[]).forEach(function(h){
    var s=document.createElement('span');s.className='g-tag';s.textContent='#'+h;tagwrap.appendChild(s);
  });
  renderPodium(users);
  renderBoard(users);
  renderVideos();
  renderHash();
  renderNote();
}

function load(){
  setState('loading');
  fetch(DATA_URL+'?t='+Date.now()).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(d){
    DATA=d;
    renderAll(true);
  }).catch(function(){setState('err')});
}

/* ── события ── */
$('umetric').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var m=b.getAttribute('data-m');if(m===metric)return;
  metric=m;
  this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-m')===m)});
  if(DATA)renderAll(false);
});
$('umore').addEventListener('click',function(){
  expU=!expU;
  if(DATA){
    var users=(DATA.topUsers||[]).slice().sort(function(a,b){return (b[metric]||0)-(a[metric]||0)});
    renderBoard(users);
  }
});
$('uvmore').addEventListener('click',function(){expV=!expV;renderVideos()});
$('ulang').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var l=b.getAttribute('data-l');if(l===lang)return;
  lang=l;
  this.classList.toggle('ru',lang==='ru');
  this.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-l')===lang)});
  applyI18n();
  if(DATA)renderAll(false);
  else setState($('ustate').innerHTML.indexOf('g-spin')>-1?'loading':'err');
});

applyI18n();
load();
/* автообновление раз в 5 минут */
setInterval(function(){
  fetch(DATA_URL+'?t='+Date.now()).then(function(r){return r.json()}).then(function(d){
    DATA=d;renderAll(false);
  }).catch(function(){});
},300000);
})();
</script>
</div>
